name: Release

# Push a version tag (no "v" prefix) to publish:
#   git tag 0.6.0 && git push origin 0.6.0
# Or re-fire an existing tag from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Releases are cut from a version tag, got ref '${GITHUB_REF}'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp the tag into the TOC
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^## Version:.*/## Version: ${version}/" ActionHouse.toc
          grep -E '^## (Title|Version|Interface|X-Curse-Project-ID):' ActionHouse.toc

      - name: Build Lua 5.1
        run: |
          set -euo pipefail
          curl -sSfL -o lua-5.1.5.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          tar xzf lua-5.1.5.tar.gz
          make -C lua-5.1.5 posix
          echo "$PWD/lua-5.1.5/src" >> "$GITHUB_PATH"

      - name: Tests
        run: |
          set -euo pipefail
          lua tests/run.lua
          lua tests/smoke_ui.lua

      - name: CurseForge token missing
        if: env.CF_API_TOKEN == ''
        run: echo "::warning::CF_API_TOKEN is not set — this run will produce a GitHub release only, with no CurseForge upload."
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}:{project-version}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
